server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/beesmart
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (dev secret - must be at least 32 bytes for HS256)
beesmart.jwt.secret=beesmart-dev-secret-key-change-me-in-production-0123456789
beesmart.jwt.expiration-ms=86400000

# Seed accounts (created only when the users table is empty)
beesmart.seed.enabled=true
