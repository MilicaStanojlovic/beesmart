<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">BeeSmart</span>
    </div>

    <h2 class="auth-title">Create account</h2>
    <p class="auth-subtitle">New accounts are registered as beekeepers</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="At least 3 characters"
             autocomplete="username" (keyup.enter)="submit()">
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="fullName" placeholder="e.g. Milica Stanojlovic"
             autocomplete="name" (keyup.enter)="submit()">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="you@example.com"
             autocomplete="email" (keyup.enter)="submit()">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="At least 5 characters"
             autocomplete="new-password" (keyup.enter)="submit()">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Repeat your password"
             autocomplete="new-password" (keyup.enter)="submit()">
    </div>

    <div class="alarm-box" *ngIf="error">{{ error }}</div>

    <button class="btn btn-primary auth-submit" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Create account' }}
    </button>

    <div class="divider"></div>

    <p class="auth-alt">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
