<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">BeeSmart</span>
    </div>

    <h2 class="auth-title">Sign in</h2>
    <p class="auth-subtitle">Knowledge-based system for optimal beehive management</p>

    <div class="warning-box" *ngIf="notice">{{ notice }}</div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="e.g. beekeeper"
             autocomplete="username" (keyup.enter)="submit()">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Your password"
             autocomplete="current-password" (keyup.enter)="submit()">
    </div>

    <div class="alarm-box" *ngIf="error">{{ error }}</div>

    <button class="btn btn-primary auth-submit" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign in' }}
    </button>

    <div class="divider"></div>

    <p class="auth-alt">
      No account yet? <a routerLink="/register">Create one</a>
    </p>

  </div>
</div>
